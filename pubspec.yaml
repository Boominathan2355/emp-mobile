name: emp_mobile
description: Employee location-tracking & duty app (Android & iOS). Talks to emp-core-service + emp-tracking-service.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                 # REST client (bearer JWT)
  geolocator: ^13.0.1         # GPS position for tracking pings
  flutter_secure_storage: ^9.2.2  # encrypted token store
  provider: ^6.1.2            # lightweight state
  local_auth: ^2.3.0          # biometric (fingerprint / face) login toggle
  intl: ^0.19.0               # date/time formatting for History

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
